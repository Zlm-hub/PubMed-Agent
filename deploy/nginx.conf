# nginx 反代（已按 tangchaolizi.xyz 填好）
# 用法：放到 deploy/nginx.conf，证书放 deploy/certs/，然后打开 docker-compose.yml 里 nginx 服务注释。
#
# ⚠️ 证书必须**同时覆盖** tangchaolizi.xyz 与 www.tangchaolizi.xyz（SNI 校验会按访问的域名比对）。
#    阿里云免费 DV 证书一次只能签一个域名：
#      · 方案一：签 www.tangchaolizi.xyz 的证书时把「tangchaolizi.xyz」加为附加域名（SAN），一张证书覆盖两个；
#      · 方案二：不要 www 子域，把下面 server_name 只留 tangchaolizi.xyz，并在 DNS 里删掉 www 的 A 记录。
#    下面默认按「方案二之外」写成两个域名，若证书只覆盖其中之一，请把它删掉。

# ---- HTTP：全部跳 HTTPS（保留 ACME 校验路径给 certbot 用）----
server {
    listen 80;
    server_name tangchaolizi.xyz www.tangchaolizi.xyz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;      # 用 certbot --webroot 签证书时用得到
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS：反代到应用容器 ----
server {
    listen 443 ssl;
    http2 on;                       # nginx >= 1.25.1（nginx:alpine 满足）；老版本改成 "listen 443 ssl http2;"
    server_name tangchaolizi.xyz www.tangchaolizi.xyz;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;

    client_max_body_size 4m;

    location / {
        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ⚠️ 关键：流式分析走 SSE。不关缓冲的话，中文综述不会「逐字出现」，
        #    而是憋到最后一次性弹出；gzip 也会破坏流式。
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

# PubMed Agent —— 子域名 + HTTPS 反代配置（可直接放到 /etc/nginx/conf.d/pubmed.conf）
#
# 用途：让 https://pubmed.tangchaolizi.xyz 直达本项目的容器（127.0.0.1:8000），
#       **不改动宿主机上已有的旧站 server 块，也不抢它的 80/443 默认站点**
#       （nginx 按 server_name 分流，子域名与根域名互不干扰）。
#
# 落地顺序（详见 deploy/README.md「情形 B」）：
#   1) DNS 加一条 A 记录：pubmed.tangchaolizi.xyz → 服务器公网 IP
#   2) 本文件放到 /etc/nginx/conf.d/，`nginx -t` 通过后 `systemctl reload nginx`
#      （此时只有 80 段生效：跳 443 + ACME 挑战目录）
#   3) 签发证书（自动续期）：
#        apt-get install -y certbot python3-certbot-nginx
#        certbot --nginx -d pubmed.tangchaolizi.xyz
#      certbot 会自动补上 443 段的证书指令并加续期定时器
#   4) 容器侧：把 deploy/.env 的 ACCESS_COOKIE_SECURE 置 1（只走 https 时），
#      然后重新创建容器 —— 若仍要保留 http://<IP>:8000 直连，就保持 0
#      （secure=1 的 cookie 在 http 下不会被保存，用户会反复被弹回登录页）

server {
    listen 80;
    listen [::]:80;
    server_name pubmed.tangchaolizi.xyz;

    # certbot 的 http-01 挑战走这里，别被下面的 301 吃掉
    location /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # nginx 1.24 用这种写法开 http2（1.25.1+ 才支持 `http2 on;`）
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pubmed.tangchaolizi.xyz;

    # 证书由 certbot 首次签发时自动写入；手动放置时用阿里云免费 DV 证书路径
    # ssl_certificate     /etc/letsencrypt/live/pubmed.tangchaolizi.xyz/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/pubmed.tangchaolizi.xyz/privkey.pem;

    # ⚠️ SSE（流式分析逐字推送）必须关缓冲，否则 nginx 会把事件攒着一起发
    proxy_buffering off;
    proxy_cache off;
    gzip off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_http_version 1.1;

    # 让应用拿到真实来源：后端 guard.client_ip 优先读 X-Forwarded-For
    # （登录锁定与按 IP 限流都依赖它，否则所有请求都会被算到 nginx 的 127.0.0.1 上）
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    client_max_body_size 8m;   # 报告快照可能较大，留点余量

    location / {
        proxy_pass http://127.0.0.1:8000;
    }
}

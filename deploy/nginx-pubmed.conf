# PubMed Agent —— 子域名 HTTPS 引导配置（bootstrap）
#
# 只包含 80 段：占住 server_name + 提供 ACME 挑战路径 + 反代到容器。
# **不要**在这里手写 443 ssl 段——证书还没签出来时 nginx -t 会直接拒绝
# （实测踩过：`no "ssl_certificate" is defined for the "listen ... ssl"`）。
#
# 正确流程：运行 deploy/setup-https.sh，它会
#   1) 把本文件装到 /etc/nginx/conf.d/pubmed.conf 并 reload（此刻只有 80 生效）
#   2) certbot --nginx 签发证书，**自动**把 443 ssl 段、证书路径与 301 跳转写进本文件
# 之后这份文件由 certbot 接管（续期时自动 reload），不需要手工维护。
# 依旧不影响宿主机旧站：独立 server_name 分流，旧站（tangchaolizi.xyz）继续走自己的 server 块。

server {
    listen 80;
    listen [::]:80;
    server_name pubmed.tangchaolizi.xyz;

    # certbot http-01 挑战走这里
    location /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    # 证书签发前，http 也先能正常用（反代到容器）；
    # certbot 装好证书后会给这里自动加 301 跳 https。
    # ⚠️ SSE（流式分析逐字推送）必须关缓冲，否则 nginx 把事件攒着一起发
    proxy_buffering off;
    proxy_cache off;
    gzip off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_http_version 1.1;
    client_max_body_size 8m;

    # 让应用拿到真实来源：后端 guard.client_ip 优先读 X-Forwarded-For
    # （登录锁定与按 IP 限流都依赖它，否则所有请求都会被算到 127.0.0.1 上）
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location / {
        proxy_pass http://127.0.0.1:8000;
    }
}

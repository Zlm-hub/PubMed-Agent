# ─────────────────────────────────────────────────────────────────────────────
# 场景：服务器上**已经装了 nginx**（systemd 管理，占着 80/443）。
# 此时不要再起我们自己的 nginx 容器（会抢 80/443 导致冲突），
# 而是把下面这段加进宿主机 nginx，反代到本项目的容器。
#
# 放置位置（Ubuntu）：
#     sudo nano /etc/nginx/sites-available/pubmed.conf     # 粘贴下面内容（按注释改域名）
#     sudo ln -s /etc/nginx/sites-available/pubmed.conf /etc/nginx/sites-enabled/
#     sudo nginx -t && sudo systemctl reload nginx
#
# 前提：容器只监听宿主机内网 —— 把 docker-compose.yml 的 ports 改成
#       "127.0.0.1:8000:8000"
#       并在 deploy/.env 里设 ACCESS_COOKIE_SECURE=1（因为走 https 了）。
# ─────────────────────────────────────────────────────────────────────────────

# 把 pubmed 换成你要用的子域名（需先在 DNS 加 A 记录指向服务器 IP）
server {
    listen 80;
    server_name pubmed.tangchaolizi.xyz;
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;                                  # nginx >= 1.25.1；1.24 请改成 "listen 443 ssl http2;"
    server_name pubmed.tangchaolizi.xyz;

    # 证书：用 certbot 单独给子域名签一张（见 README 第五节的 certbot 命令），
    # 或替换成你已有证书的路径。
    ssl_certificate     /etc/letsencrypt/live/pubmed.tangchaolizi.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pubmed.tangchaolizi.xyz/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    client_max_body_size 4m;

    location / {
        proxy_pass http://127.0.0.1:8000;      # 指向本项目的容器
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ⚠️ 必需：流式分析走 SSE，关了缓冲综述才「逐字出现」
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
